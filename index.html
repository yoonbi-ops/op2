    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuButton = document.getElementById("menu-button");
            const menuOverlay = document.getElementById("menu-overlay");
            function createLeafEffect() {
                const leafContainer = document.getElementById('leaf-container');
                if(!leafContainer) return;
                leafContainer.innerHTML = '';
                const numberOfLeaves = 40; 
                const leafColors = ['#2E8B57', '#3CB371', '#8FBC8F', '#6B8E23'];
                
                for (let i = 0; i < numberOfLeaves; i++) {
                    const leaf = document.createElement('div');
                    leaf.classList.add('leaf');
                    
                    const startX = Math.random() * window.innerWidth;
                    const duration = Math.random() * 4 + 3;
                    const delay = Math.random() * 3;
                    
                    const swayX = Math.random() * 150 - 75;
                    leaf.style.left = `${startX}px`;
                    leaf.style.width = `${Math.random() * 10 + 8}px`;
                    leaf.style.height = `${Math.random() * 10 + 8}px`;
                    leaf.style.backgroundColor = leafColors[Math.floor(Math.random() * leafColors.length)];
                    leaf.style.borderRadius = '10% 90% 20% 80% / 50% 90% 10% 50%';
                    leaf.style.transform = `rotate(${Math.random() * 360}deg)`;
                    
                    leaf.animate([
                        { transform: `translateX(0px) translateY(-50px) rotateZ(${Math.random() * 360}deg)`, opacity: 0 },
                        { opacity: 1 },
                        { transform: `translateX(${swayX}px) translateY(${window.innerHeight + 50}px) rotateZ(${Math.random() * 720 + 360}deg)`, opacity: 0 }
                    ], {
                        duration: duration * 1000,
                        delay: delay * 1000,
                        fill: 'forwards'
                    });
                    leafContainer.appendChild(leaf);
                    
                    setTimeout(() => {
                        if(leaf) leaf.remove();
                    }, (duration + delay + 1) * 1000);
                }
            }
            
            menuButton.addEventListener("click", () => {
                menuButton.classList.toggle("open");
                menuOverlay.classList.toggle("open");
                
                if (menuButton.classList.contains("open")) {
                    setTimeout(createLeafEffect, 100);
                }
            });
            const menuLinks = document.querySelectorAll(".menu-nav a");
            menuLinks.forEach(link => {
                link.addEventListener("click", () => {
                    if(!link.classList.contains('coming-soon')) {
                        menuButton.classList.remove("open");
                        menuOverlay.classList.remove("open");
                    }
                });

            }
            
            const storyPage = document.getElementById('story-page');
            const nextButton = document.querySelector('#story-page .next-button');
            const closeButton = document.querySelector('#story-page .close-button');
            if(nextButton) {
                nextButton.addEventListener('click', () => {
                    storyPage.classList.add('show-webtoon');
                });
            }
            if(closeButton) {
                closeButton.addEventListener('click', () => {
                    storyPage.classList.remove('show-webtoon');
                });
            }
            
            // '怨좊쭑 ?ъ튇' ???대┃ ?대깽??
            const gomakCircle = document.getElementById('gomak-circle');
            if (gomakCircle && lightbox) {
                const lightboxImage = lightbox.querySelector('.lightbox-image');
                
                gomakCircle.addEventListener('click', () => {
                    const imagePath = "?μ냼/怨좊쭑?ъ튇_理쒖쥌.png";
                    lightboxImage.setAttribute('src', imagePath);
                    lightbox.classList.add('open');
                });
            }
        });
    </script>
</body>
</html>
